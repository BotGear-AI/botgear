[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oakd_service"
version = "1.0.0"
description = "botgear OAK-D service — Luxonis depth camera capture (RGB + on-device stereo depth) + MJPEG streaming."
requires-python = ">=3.10"
dependencies = [
    # DepthAI V2 API — pinned below 3.0. V2 is the long-established,
    # widely-documented API every current OAK-D Lite tutorial targets;
    # V3's maturity on RVC2 (Myriad X) hardware isn't proven yet on the
    # hardware this service was first tested against. See
    # this type's README.md for the full reasoning + the V3 migration note.
    "depthai>=2.24,<3.0",
    # Depth colorization (cv2.applyColorMap) + JPEG encoding — same
    # dependency + pin the video service already uses.
    "opencv-contrib-python-headless>=4.8,<5.0",
    "numpy>=1.24",
    # YOLO inference for the ``yolo`` filter (host-CPU, decoded RGB
    # frame — see filters/yolo.py's docstring for why this isn't the
    # OAK-D's on-device spatial network). ultralytics pulls torch +
    # torchvision (~300 MB on first install). The filter is opt-in
    # (operator adds it to the pipeline) and the model weights file
    # auto-downloads from the Ultralytics hub on first inference.
    "ultralytics>=8.0",
]

[project.scripts]
oakd_service = "oakd_service.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
