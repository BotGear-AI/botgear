[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlx_messaging"
version = "0.1.0"
description = "Shared text-messaging capability for botgear: MessagingServiceBase (inbox queue + listen/speak/send/list_channels + retained state) that discord/slack/google_chat subclass, implementing the docs/TODO_MESSAGING.md `messaging` capability contract."
requires-python = ">=3.10"
# No hard deps: rlx_bus (SubprocessService/ServiceConfig) and pydantic are
# already installed into every service venv by runtime/installer.py before
# this package is installed. Listing rlx_bus here would make pip try PyPI.
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
