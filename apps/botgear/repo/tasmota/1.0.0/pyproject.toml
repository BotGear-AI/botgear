[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tasmota_service"
version = "1.0.0"
description = "botgear Tasmota service — HTTP command-API relay control for any device running Tasmota firmware (Sonoff, Shelly reflashed, generic ESP8266/ESP32 relay boards, etc). Runs as a subprocess so a slow/unreachable device can never block the backend event loop."
requires-python = ">=3.10"
dependencies = [
    # Tasmota's command API is a plain HTTP GET (http://<host>/cm?cmnd=...) —
    # httpx gives an async-native client that matches this service's
    # asyncio loop with no extra thread-pool ceremony.
    "httpx>=0.27,<1.0",
    # rlx_bus (WebSocket bus client) is pre-installed into every venv
    # by runtime/installer.py so it doesn't have to be listed here.
]

[project.scripts]
tasmota_service = "tasmota_service.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
